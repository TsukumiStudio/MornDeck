name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead. English or Japanese.
    validations:
      required: true
  - type: input
    attributes:
      label: Version
      description: Output of `mdeck --version`
    validations:
      required: true
  - type: input
    attributes:
      label: Environment
      description: macOS version, terminal app, and the agent (claude / codex / copilot) with its version
  - type: textarea
    attributes:
      label: Logs
      description: Relevant lines from `~/.mdeck/events.log`. They can contain your prompts and replies; remove anything private.
      render: text
