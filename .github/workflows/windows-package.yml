name: Windows package

# Windows 側の mdeck.exe を x64 と arm64 の zip にまとめる。WSL の中で動く Linux 版 (musl の静的ビルド) は zip に入れず、
# リリースに mdeck-<版>-wsl-<arch> として置く (mdeck.exe が初回に落とし、埋めた SHA-256 で確かめる)。
# mdeck.exe は MornNotary (secret MORN_NOTARY_TOKEN) で署名する。署名が Valid でなければ止まる。
# winget のマニフェストの下書きも作る。手で実行 (署名を試すとき) と、Release workflow からの呼び出しの両方で使う
on:
  workflow_dispatch:
  workflow_call:

permissions: {}

jobs:
  linux:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            arch: x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            arch: aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build (static)
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools >/dev/null
          rustup target add ${{ matrix.target }}
          cargo build --locked --release --target ${{ matrix.target }}
          bin=target/${{ matrix.target }}/release/mdeck
          file "$bin"
          file "$bin" | grep -Eq 'statically linked|static-pie linked'
          test "$("$bin" --version)" = "mdeck $(cargo pkgid | sed 's/.*[#@]//')"
          cp "$bin" mdeck-linux-${{ matrix.arch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.arch }}
          path: mdeck-linux-${{ matrix.arch }}
          if-no-files-found: error

  windows:
    # x64 と arm64 の exe をここで作って署名する。Linux 版のビルドと同時に始め、依存のビルドを先に済ませる
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # SHA-256 無しで一度ビルドしておく (後のビルドは mdeck 自身だけになる)
      - name: Build the dependencies
        working-directory: win
        run: |
          set -euo pipefail
          rustup target add x86_64-pc-windows-msvc aarch64-pc-windows-msvc
          for t in x86_64-pc-windows-msvc aarch64-pc-windows-msvc; do
            cargo build --locked --release --target $t
          done
      - name: Wait for the Linux build
        shell: bash
        env:
          WANT: "^linux-(x86_64|aarch64)$"
          COUNT: "2"
          FROM: "linux"
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 同じ run の別のジョブが上げる成果物を待つ (ジョブの needs で待つと、ここまでの準備が直列になる)
          for _ in $(seq 150); do
            n=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" --jq "[.artifacts[].name | select(test(\"$WANT\"))] | length")
            [ "$n" -ge "$COUNT" ] && exit 0
            # 上げるジョブが落ちていれば待たない
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" --jq '.jobs[] | select(.conclusion == "failure") | .name' | grep -Eq "$FROM"; then
              echo "::error::$FROM failed"; exit 1
            fi
            sleep 10
          done
          echo "::error::timed out waiting for $WANT"; exit 1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: linux-*
          merge-multiple: true
          path: dist/linux
      - name: Build mdeck.exe (x64 and arm64)
        working-directory: win
        run: |
          set -euo pipefail
          VERSION=$(cd .. && cargo pkgid | sed 's/.*[#@]//')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # mdeck.exe は初回に同じ版の Linux 版をリリースから WSL へ落とす。中身を確かめる SHA-256 を埋めておく
          mkdir -p ../dist/wsl
          for a in x86_64 aarch64; do
            cp "../dist/linux/mdeck-linux-$a" "../dist/wsl/mdeck-$VERSION-wsl-$a"
          done
          MDECK_WSL_SHA256_X86_64=$(sha256sum "../dist/wsl/mdeck-$VERSION-wsl-x86_64" | cut -d' ' -f1)
          MDECK_WSL_SHA256_AARCH64=$(sha256sum "../dist/wsl/mdeck-$VERSION-wsl-aarch64" | cut -d' ' -f1)
          export MDECK_WSL_SHA256_X86_64 MDECK_WSL_SHA256_AARCH64
          for t in x86_64-pc-windows-msvc aarch64-pc-windows-msvc; do
            cargo build --locked --release --target $t
          done
          test "$(target/x86_64-pc-windows-msvc/release/mdeck.exe --version)" = "mdeck $VERSION (Windows)"
          mkdir -p ../dist/x64 ../dist/arm64
          cp target/x86_64-pc-windows-msvc/release/mdeck.exe ../dist/x64/
          cp target/aarch64-pc-windows-msvc/release/mdeck.exe ../dist/arm64/
      # 署名は MornNotary に頼む (Azure Artifact Signing。Azure の値は MornNotary の側にだけある)
      - name: Sign mdeck.exe via MornNotary
        env:
          GH_TOKEN: ${{ secrets.MORN_NOTARY_TOKEN }}
        run: |
          set -euo pipefail
          (cd dist && 7z a -tzip ../exe.zip x64/mdeck.exe arm64/mdeck.exe >/dev/null)
          gh auth setup-git
          gh repo clone matsufriends/MornNotary "$RUNNER_TEMP/MornNotary" -- --depth 1
          bash "$RUNNER_TEMP/MornNotary/sign.sh" exe.zip
          7z x -y -odist exe-signed.zip >/dev/null
      - name: Check signatures
        shell: pwsh
        run: |
          foreach ($a in 'x64', 'arm64') {
            $s = Get-AuthenticodeSignature "dist\$a\mdeck.exe"
            Write-Output "$a : $($s.Status) $($s.SignerCertificate.Subject)"
            if ($s.Status -ne 'Valid') { throw "dist\$a\mdeck.exe is not signed" }
          }
      - name: Zip
        run: |
          set -euo pipefail
          for win in x64 arm64; do
            d=dist/$win
            cp LICENSE "$d/"
            cp THIRD_PARTY_LICENSES "$d/THIRD_PARTY_LICENSES"
            cp win/THIRD_PARTY_LICENSES "$d/THIRD_PARTY_LICENSES-windows"
            (cd "$d" && 7z a -tzip "../MornDeck-$VERSION-windows-$win.zip" . >/dev/null)
          done
          ls -l dist/*.zip
      - name: winget manifests (draft)
        run: |
          set -euo pipefail
          python packaging/winget.py "$VERSION" dist/winget "dist/MornDeck-$VERSION-windows-x64.zip" "dist/MornDeck-$VERSION-windows-arm64.zip"
          if ! command -v winget >/dev/null; then echo "::notice::winget is not on this runner; the manifests were not validated"; exit 0; fi
          # ランナーの winget は新しいスキーマを知らず、警告で 0 以外を返す。「succeeded」なら通す
          out=$(winget validate "dist/winget/manifests/t/TsukumiStudio/MornDeck/$VERSION" 2>&1) || true
          echo "$out"
          grep -q 'Manifest validation succeeded' <<<"$out"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-package
          path: |
            dist/*.zip
            dist/wsl
            dist/winget
          if-no-files-found: error

  # 下書きのマニフェストで、winget から実際に入れて起動し、消せるか確かめる。
  # zip は手元の HTTP サーバーから配る (ローカルのマニフェストは winget の設定で許してから使う)
  winget-install:
    needs: windows
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-package
          path: pkg
      - name: Install, run and uninstall with winget
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Get-ChildItem pkg\MornDeck-*-windows-x64.zip | Select-Object -First 1
          $arm = Get-ChildItem pkg\MornDeck-*-windows-arm64.zip | Select-Object -First 1
          $version = $zip.Name -replace '^MornDeck-(.+)-windows-x64\.zip$', '$1'
          Start-Process python -ArgumentList '-m', 'http.server', '8765', '--bind', '127.0.0.1', '--directory', 'pkg' -WindowStyle Hidden
          # python の起動が遅いランナーがあるので、応えるまで待つ (固定の 2 秒では足りないことがあった)
          for ($n = 0; $n -lt 30; $n++) { try { Invoke-WebRequest -UseBasicParsing -TimeoutSec 2 http://127.0.0.1:8765/ | Out-Null; break } catch { Start-Sleep -Seconds 1 } }
          $env:WINGET_BASE_URL = 'http://127.0.0.1:8765'
          python packaging/winget.py $version test $zip.FullName $arm.FullName
          $m = "test\manifests\t\TsukumiStudio\MornDeck\$version"
          winget settings --enable LocalManifestFiles
          winget install --manifest $m --accept-package-agreements --accept-source-agreements --disable-interactivity
          if ($LASTEXITCODE -ne 0) { throw "winget install failed ($LASTEXITCODE)" }
          $exe = Join-Path $env:LOCALAPPDATA 'Microsoft\WinGet\Links\mdeck.exe'
          $v = & $exe --version
          Write-Output $v
          if ($v -ne "mdeck $version (Windows)") { throw "unexpected version: $v" }
          # WSL の無いランナーでは案内を出して 0 以外で終わる (WSL があればそのまま WSL の中の mdeck に渡る)
          $out = & $exe doctor 2>&1 | Out-String
          Write-Output "mdeck doctor (exit $LASTEXITCODE): $out"
          if ($LASTEXITCODE -ne 0 -and $out -notmatch 'wsl --install') { throw "no WSL guidance: $out" }
          winget uninstall --manifest $m --accept-source-agreements --disable-interactivity
          if ($LASTEXITCODE -ne 0) { throw "winget uninstall failed ($LASTEXITCODE)" }
          if (Test-Path $exe) { throw "mdeck.exe is still in the WinGet Links folder" }


  # 本物の wsl.exe を通して、zip の mdeck.exe が WSL の中に本体を入れ、サーバーを起動し、引数を渡せるか確かめる。
  # GitHub のランナーでは WSL2 が使えないので WSL1 で試す
  # WSL を入れるのに 2 分ほどかかるので、exe を待たずに始める
  wsl:
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7.2.0
        with:
          distribution: Ubuntu-24.04
          wsl-version: 1
          additional-packages: curl
      - name: Wait for the Windows package
        shell: bash
        env:
          WANT: "^windows-package$"
          COUNT: "1"
          FROM: "(^|/ )(windows|linux)( |$)"
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 同じ run の別のジョブが上げる成果物を待つ (ジョブの needs で待つと、ここまでの準備が直列になる)
          for _ in $(seq 150); do
            n=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" --jq "[.artifacts[].name | select(test(\"$WANT\"))] | length")
            [ "$n" -ge "$COUNT" ] && exit 0
            # 上げるジョブが落ちていれば待たない
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" --jq '.jobs[] | select(.conclusion == "failure") | .name' | grep -Eq "$FROM"; then
              echo "::error::$FROM failed"; exit 1
            fi
            sleep 10
          done
          echo "::error::timed out waiting for $WANT"; exit 1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-package
          path: pkg
      - name: mdeck.exe drives the Linux mdeck in WSL
        timeout-minutes: 10
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Get-ChildItem pkg\MornDeck-*-windows-x64.zip | Select-Object -First 1
          $version = $zip.Name -replace '^MornDeck-(.+)-windows-x64\.zip$', '$1'
          Expand-Archive $zip -DestinationPath m
          if (Test-Path m\mdeck-linux-*) { throw "the zip still has the Linux build" }
          $exe = Resolve-Path m\mdeck.exe
          # 本体はリリースから落とす。ここでは手元のサーバーから同じファイルを配る (SHA-256 は mdeck.exe に埋めたもので確かめる)
          Start-Process python -ArgumentList '-m', 'http.server', '8766', '--bind', '127.0.0.1', '--directory', 'pkg\wsl' -WindowStyle Hidden
          # python の起動が遅いランナーがあるので、応えるまで待つ (固定の 2 秒では足りないことがあった)
          for ($n = 0; $n -lt 30; $n++) { try { Invoke-WebRequest -UseBasicParsing -TimeoutSec 2 http://127.0.0.1:8766/ | Out-Null; break } catch { Start-Sleep -Seconds 1 } }
          $env:MDECK_DOWNLOAD_BASE = 'http://127.0.0.1:8766'
          function run { & $exe @args; if ($LASTEXITCODE -ne 0) { throw "mdeck $args failed ($LASTEXITCODE)" } }
          run --version
          # 1 回目: WSL の中に本体を入れ、Windows 側からサーバーを起動してから一覧を出す
          $tabs = run tabs | Out-String
          Write-Output $tabs
          $v = (run running | Out-String).Trim()
          if ($v -ne $version) { throw "the server runs $v, not $version" }
          # 引数 (JSON) が wsl.exe と sh を通っても崩れない
          run api '{"cmd":"open_tab","name":"ci-tab","cwd":"/tmp","run":"echo hello from mdeck"}'
          $tabs = run tabs | Out-String
          Write-Output $tabs
          if ($tabs -notmatch 'ci-tab') { throw "the tab did not open" }
          wsl -e sh -c 'ls -l "$HOME/.local/bin/mdeck" && "$HOME/.local/bin/mdeck" --version'
          # 2 回目は入れ直さない (同じ版)
          $out = & $exe tabs 2>&1 | Out-String
          if ($out -match 'installed mdeck') { throw "installed again: $out" }
          run kill
          & $exe running
          if ($LASTEXITCODE -eq 0) { throw "the server is still running after kill" }
          exit 0
