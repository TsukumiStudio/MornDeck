name: Release

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check release secrets
        env:
          MORN_NOTARY_TOKEN: ${{ secrets.MORN_NOTARY_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          for name in MORN_NOTARY_TOKEN HOMEBREW_TAP_TOKEN; do
            if [ -z "${!name:-}" ]; then echo "::error::Set ${name} in Actions secrets."; exit 1; fi
          done
      - name: Check version matches tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          test "$(cargo pkgid | sed 's/.*[#@]//')" = "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '$0 == "## " v {on=1; next} /^## /{on=0} on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then echo "::error::CHANGELOG.md に ## ${VERSION} の節が無い"; exit 1; fi
      - name: cargo test
        run: |
          set -o pipefail
          cargo test --locked 2>&1 | tee test.log || { grep -E 'panicked|^    [a-z:_]+$' test.log | head -20 | sed 's/^/::error::/'; exit 1; }
      - run: zsh build.sh
      - name: Sign and notarize via MornNotary
        env:
          GH_TOKEN: ${{ secrets.MORN_NOTARY_TOKEN }}
        run: |
          set -euo pipefail
          gh auth setup-git
          gh repo clone matsufriends/MornNotary "$RUNNER_TEMP/MornNotary" -- --depth 1
          bash "$RUNNER_TEMP/MornNotary/sign.sh" dist/MornDeck.app
          mv dist/MornDeck-signed.zip dist/MornDeck.app.zip
      - name: Verify what will be published
        run: |
          set -euo pipefail
          ditto -x -k dist/MornDeck.app.zip "$RUNNER_TEMP/verify"
          app="$RUNNER_TEMP/verify/MornDeck.app"
          codesign --verify --strict --deep -vv "$app"
          assessed=$(spctl --assess --type execute -vv "$app" 2>&1) || true
          echo "$assessed"
          grep -q 'Notarized Developer ID' <<<"$assessed"
          xcrun stapler validate "$app"
          test "$(lipo -archs "$app/Contents/MacOS/mdeck" | tr ' ' '\n' | sort | xargs)" = "arm64 x86_64"
          test -s "$app/Contents/Resources/THIRD_PARTY_LICENSES"
          test "$("$app/Contents/MacOS/mdeck" --version)" = "mdeck $VERSION"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/MornDeck.app.zip THIRD_PARTY_LICENSES --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/MornDeck.app.zip THIRD_PARTY_LICENSES --notes-file "$RUNNER_TEMP/notes.md"
          fi
      - name: Update Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          SHA=$(shasum -a 256 dist/MornDeck.app.zip | awk '{print $1}')
          gh auth setup-git
          gh repo clone TsukumiStudio/homebrew-tap tap -- --depth 1
          mkdir -p tap/Casks
          sed -e "s/@VERSION@/${VERSION}/g" -e "s/@SHA256@/${SHA}/g" packaging/morndeck.rb.in > tap/Casks/morndeck.rb
          ruby -c tap/Casks/morndeck.rb
          cd tap
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add Casks/morndeck.rb
          if ! git diff --cached --quiet; then
            git commit -m "morndeck ${VERSION}"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

  # Windows (WSL) 版。リポジトリの変数 WINDOWS_RELEASE を true にするまでは動かない (mac のリリースはそのまま)
  windows-package:
    needs: release
    if: vars.WINDOWS_RELEASE == 'true'
    uses: ./.github/workflows/windows-package.yml
    permissions:
      contents: read
      id-token: write
    secrets: inherit

  windows-publish:
    needs: windows-package
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-package
          path: dist
      - name: Upload the zips to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber -R "$GITHUB_REPOSITORY"
      # 初回の登録は手で PR を出す (下書きは windows-package の成果物の winget フォルダ)。2 回目からはここで更新の PR を出す
      - name: Submit the winget update
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "${WINGET_TOKEN:-}" ]; then echo "::notice::WINGET_TOKEN is not set; skipped the winget update"; exit 0; fi
          # 未認証だとランナーの共有の IP で回数の上限に当たる。404 (まだ無い) のときだけ飛ばし、ほかの失敗は止める
          code=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $WINGET_TOKEN" https://api.github.com/repos/microsoft/winget-pkgs/contents/manifests/t/TsukumiStudio/MornDeck)
          if [ "$code" = 404 ]; then echo "::notice::TsukumiStudio.MornDeck is not in winget-pkgs yet; submit the first manifest by hand"; exit 0; fi
          if [ "$code" != 200 ]; then echo "::error::cannot check winget-pkgs (HTTP $code)"; exit 1; fi
          curl -fsSL -o wingetcreate.exe https://aka.ms/wingetcreate/latest
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          ./wingetcreate.exe update TsukumiStudio.MornDeck --version "$VERSION" \
            --urls "$base/MornDeck-$VERSION-windows-x64.zip|x64" "$base/MornDeck-$VERSION-windows-arm64.zip|arm64" \
            --submit --token "$WINGET_TOKEN"

  # Linux 版の tar.gz。リポジトリの変数 LINUX_RELEASE を true にするまでは動かない (mac のリリースはそのまま)
  linux-package:
    needs: release
    if: vars.LINUX_RELEASE == 'true'
    uses: ./.github/workflows/linux-package.yml
    permissions:
      contents: read

  linux-publish:
    needs: linux-package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: linux-package-*
          merge-multiple: true
          path: dist
      - name: Upload the tarballs to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c ./*.sha256)
          gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.tar.gz.sha256 --clobber -R "$GITHUB_REPOSITORY"

  # 配った cask を何も入っていない Mac に入れて、起動できることを確かめる
  install-check:
    needs: release
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - run: |
          brew install --cask tsukumistudio/tap/morndeck
          test "$(mdeck --version)" = "mdeck ${GITHUB_REF_NAME#v}"
          # Intel 側も動くこと (Rosetta)
          softwareupdate --install-rosetta --agree-to-license >/dev/null 2>&1 || true
          test "$(arch -x86_64 mdeck --version)" = "mdeck ${GITHUB_REF_NAME#v}"
          mdeck --licenses | grep -q 'Third-party software'
          brew uninstall --cask --zap tsukumistudio/tap/morndeck
