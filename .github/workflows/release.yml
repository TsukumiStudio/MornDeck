name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check release secrets
        env:
          MORN_NOTARY_TOKEN: ${{ secrets.MORN_NOTARY_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          for name in MORN_NOTARY_TOKEN HOMEBREW_TAP_TOKEN; do
            if [ -z "${!name:-}" ]; then echo "::error::Set ${name} in Actions secrets."; exit 1; fi
          done
      - name: Check version matches tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          test "$(cargo pkgid | sed 's/.*[#@]//')" = "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: cargo test
        run: |
          set -o pipefail
          cargo test 2>&1 | tee test.log || { grep -E 'panicked|^    [a-z:_]+$' test.log | head -20 | sed 's/^/::error::/'; exit 1; }
      - run: zsh build.sh
      - name: Sign and notarize via MornNotary
        env:
          GH_TOKEN: ${{ secrets.MORN_NOTARY_TOKEN }}
        run: |
          set -euo pipefail
          gh auth setup-git
          gh repo clone matsufriends/MornNotary "$RUNNER_TEMP/MornNotary" -- --depth 1
          bash "$RUNNER_TEMP/MornNotary/sign.sh" dist/MornDeck.app
          mv dist/MornDeck-signed.zip dist/MornDeck.app.zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/MornDeck.app.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/MornDeck.app.zip --generate-notes
          fi
      - name: Update Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          SHA=$(shasum -a 256 dist/MornDeck.app.zip | awk '{print $1}')
          gh auth setup-git
          gh repo clone TsukumiStudio/homebrew-tap tap -- --depth 1
          mkdir -p tap/Casks
          sed -e "s/@VERSION@/${VERSION}/g" -e "s/@SHA256@/${SHA}/g" packaging/morndeck.rb.in > tap/Casks/morndeck.rb
          ruby -c tap/Casks/morndeck.rb
          cd tap
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add Casks/morndeck.rb
          if ! git diff --cached --quiet; then
            git commit -m "morndeck ${VERSION}"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
