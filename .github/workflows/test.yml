name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: THIRD_PARTY_LICENSES is up to date
        run: python3 packaging/licenses.py --check && python3 packaging/licenses.py --win --check
      - name: cargo fmt
        run: cargo fmt --check
      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Intel build compiles
        run: cargo check --locked --target x86_64-apple-darwin
      - name: cargo test
        run: |
          set -o pipefail
          cargo test --locked 2>&1 | tee test.log || { grep -E 'panicked|^    [a-z:_]+$' test.log | head -20 | sed 's/^/::error::/'; exit 1; }
      - name: end-to-end (server, hooks, send, restart)
        run: cargo build --locked && ci/e2e.sh target/debug/mdeck

  # WSL の中で動かす Linux 版
  linux:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: cargo test
        run: |
          set -o pipefail
          cargo test --locked 2>&1 | tee test.log || { grep -E 'panicked|^    [a-z:_]+$' test.log | head -20 | sed 's/^/::error::/'; exit 1; }
      - name: end-to-end (server, hooks, send, restart)
        run: cargo build --locked && ci/e2e.sh target/debug/mdeck
      # Windows の zip に入れるのは musl の静的ビルド。リリースのときに初めて壊れないよう、ここでも作って通しで確かめる
      - name: end-to-end with the static (musl) build
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools >/dev/null
          t=$(uname -m)-unknown-linux-musl
          rustup target add "$t"
          cargo build --locked --release --target "$t"
          ci/e2e.sh "target/$t/release/mdeck"

  # Windows 側の mdeck.exe (win/)。WSL の中の本体を起動する
  windows:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: win
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: cargo fmt
        run: cargo fmt --check
      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --locked
      - name: mdeck.exe runs
        run: cargo run --locked -- --version
