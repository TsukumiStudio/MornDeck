[package]
name = "mdeck"
version = "0.4.6"
edition = "2024"
rust-version = "1.93"
description = "Terminal multiplexer with a sidebar that tracks claude / codex / copilot state"
repository = "https://github.com/TsukumiStudio/MornDeck"
license = "Unlicense"
# crates.io の mdeck は別のツール
publish = false

[dependencies]
alacritty_terminal = "0.26.0"
block2 = "0.6.2"
libc = "0.2.191"
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSBundle", "NSString", "NSError"] }
objc2-user-notifications = { version = "0.3.2", default-features = false, features = ["std", "block2", "UNUserNotificationCenter", "UNNotificationContent", "UNNotificationRequest", "UNNotificationTrigger"] }
portable-pty = "0.9.0"
ratatui = { version = "0.30.2", features = ["unstable-backend-writer"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
