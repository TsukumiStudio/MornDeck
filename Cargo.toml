[package]
name = "mdeck"
version = "0.4.5"
edition = "2024"
rust-version = "1.93"
description = "Terminal multiplexer with a sidebar that tracks claude / codex / copilot state"
repository = "https://github.com/TsukumiStudio/MornDeck"
license = "Unlicense"
# crates.io の mdeck は別のツール
publish = false

[dependencies]
alacritty_terminal = "0.26.0"
libc = "0.2.191"
portable-pty = "0.9.0"
ratatui = { version = "0.30.2", features = ["unstable-backend-writer"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
